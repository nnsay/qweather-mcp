[tool.coverage.run]
branch = true
source = [ "qweather_mcp" ]
data_file = ".coverage"

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html
 --cov-report xml
"""

[project]
name = "qweather-mcp"
version = "1.0.0"
description = "QWeather MCP server: stdio / streamable-http dual transport, JWT auth, 21 tools"
requires-python = ">=3.12,<4"
readme = 'README.md'
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "mcp>=2,<3",
  "pyjwt[crypto]>=2.10",
  "httpx>=0.28",
]

[project.scripts]
qweather-mcp = "qweather_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["qweather_mcp"]

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
exclude = [
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "dist",
]

line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # isort
  "I",
]
ignore = []

fixable = ["ALL"]
unfixable = []
